<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="border_grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="facet_top" x1="19" y1="16" x2="45" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="facet_right" x1="33" y1="25" x2="47" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="facet_left" x1="17" y1="25" x2="31" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <radialGradient id="core_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="64" height="64" rx="16" fill="#090D16"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#border_grad)" stroke-width="1.5" stroke-opacity="0.85"/>

  <!-- Ambient Glow Behind Geometric Crystal -->
  <circle cx="32" cy="32" r="16" fill="url(#core_glow)"/>

  <!-- Isometric Facet 1: Top Shield (Cyan / Sky) -->
  <path d="M32 16L45.5 23.8L32 31.6L18.5 23.8Z" fill="url(#facet_top)"/>
  
  <!-- Isometric Facet 2: Right Prism (Indigo / Electric Blue) -->
  <path d="M33 33.2L46.5 25.4V41L33 48.8Z" fill="url(#facet_right)"/>

  <!-- Isometric Facet 3: Left Prism (Purple / Cosmic Violet) -->
  <path d="M31 33.2L17.5 25.4V41L31 48.8Z" fill="url(#facet_left)"/>

  <!-- Central Nexus Energy Star (Pure Symbol, No Letters) -->
  <path d="M32 28.5C32 30.5 33.5 32 35.5 32C33.5 32 32 33.5 32 35.5C32 33.5 30.5 32 28.5 32C30.5 32 32 30.5 32 28.5Z" fill="#FFFFFF"/>
</svg>
